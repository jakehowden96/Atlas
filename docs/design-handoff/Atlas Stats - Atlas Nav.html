<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atlas Stats — Atlas navigation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: CodeBurn's dashboard pages rebuilt inside Atlas's Stats view with Atlas's own tokens (src/app.css). */
:root {
  color-scheme: light;
  --bg: #f5f5f7; --surface: #ffffff; --surface2: #f0f0f3; --surface3: #e5e5ea;
  --border: rgba(0,0,0,.08); --border2: rgba(0,0,0,.14);
  --text: #17181b; --muted: #474a50;
  --accent: #217457; --accent-ink: #ffffff; --warn: #846122; --danger: #b1403a;
  --model-opus: #8b7cf6; --model-sonnet: #4aa3df; --model-haiku: #e089b8;
  --r-xs: 3px; --r-sm: 4px; --r-md: 6px; --r-card: 8px; --r-pill: 999px;
  --font-ui: "Geist", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, monospace;
  --fs-2xs: 12px; --fs-xs: 13px; --fs-sm: 14px; --fs-xl: 19px; --fs-2xl: 24px;
  --fw-body: 450; --fw-medium: 500; --fw-semi: 600; --fw-bold: 700;
  --sp-0: 2px; --sp-1: 4px; --sp-2: 6px; --sp-3: 8px; --sp-4: 12px; --sp-5: 16px; --sp-6: 20px; --sp-7: 24px;
  --h-sm: 24px; --h-md: 28px;
  --elev-1: 0 1px 2px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.08);
  --overlay: rgba(23,24,27,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1012; --surface: #16171a; --surface2: #1d1f23; --surface3: #25272c;
    --border: rgba(255,255,255,.08); --border2: rgba(255,255,255,.16);
    --text: #e6e7ea; --muted: #acb2bc; --accent: #2fa37a; --accent-ink: #0f1012;
    --warn: #e0a53a; --danger: #f55950;
    --elev-1: 0 1px 2px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.4); --overlay: rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1012; --surface: #16171a; --surface2: #1d1f23; --surface3: #25272c;
  --border: rgba(255,255,255,.08); --border2: rgba(255,255,255,.16);
  --text: #e6e7ea; --muted: #acb2bc; --accent: #2fa37a; --accent-ink: #0f1012;
  --warn: #e0a53a; --danger: #f55950;
  --elev-1: 0 1px 2px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.4); --overlay: rgba(0,0,0,.55);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-ui); font-size: var(--fs-sm); font-weight: var(--fw-body);

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stats { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp-4); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
button { font: inherit; }

/* controls */
.bar { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
.spacer { flex: 1; }
.seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-md); max-width: 100%; overflow-x: auto; }
.seg button { height: var(--h-sm); padding: 0 var(--sp-4); border: 1px solid transparent; border-radius: var(--r-sm); background: none; color: var(--muted); font-size: var(--fs-xs); font-weight: var(--fw-medium); white-space: nowrap; cursor: pointer; }
.seg button:hover { color: var(--text); }

.btn { height: var(--h-sm); padding: 0 var(--sp-4); border: 1px solid var(--border2); border-radius: var(--r-md); background: var(--surface); color: var(--text); font-size: var(--fs-xs); font-weight: var(--fw-medium); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface2); }

.live { color: var(--muted); font-family: var(--font-mono); font-size: var(--fs-xs); }

/* cards + layout */
.card { min-width: 0; padding: var(--sp-5); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); }
.label { margin: 0 0 var(--sp-3); font-size: var(--fs-2xs); font-weight: var(--fw-semi); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); display: flex; justify-content: space-between; gap: var(--sp-3); align-items: baseline; }
.label small { font-size: var(--fs-2xs); font-weight: var(--fw-body); letter-spacing: 0; text-transform: none; color: var(--muted); }
.sub { color: var(--muted); font-size: var(--fs-xs); margin: 0; }
.grid { display: grid; gap: var(--sp-4); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.start { align-items: start; }
@media (max-width: 860px) { .g4, .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) { .g3 { grid-template-columns: minmax(0, 1fr); } }

.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-4); }
.big { margin: var(--sp-1) 0; font-family: var(--font-mono); font-size: calc(var(--fs-2xl) * 1.6); line-height: 1.1; font-weight: var(--fw-semi); letter-spacing: -.02em; color: var(--accent); }
.chart { position: relative; width: 100%; min-height: 190px; }
.chart svg { display: block; overflow: visible; }
.chart text, .flow text { font-family: var(--font-mono); font-size: var(--fs-2xs); fill: var(--muted); }
.tip { position: absolute; top: 0; transform: translateX(-50%); pointer-events: none; display: none; gap: var(--sp-3); padding: var(--sp-1) var(--sp-3); background: var(--surface); border: 1px solid var(--border2); border-radius: var(--r-md); box-shadow: var(--elev-1); font-size: var(--fs-xs); white-space: nowrap; }
.tip b { font-family: var(--font-mono); font-weight: var(--fw-semi); }
.legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5); margin: var(--sp-3) 0 0; padding: 0; list-style: none; color: var(--muted); font-size: var(--fs-2xs); }
.legend li { display: inline-flex; align-items: center; gap: var(--sp-2); }
.dot { display: inline-block; width: 8px; height: 8px; margin-right: var(--sp-3); border-radius: 50%; flex-shrink: 0; }
.legend .dot { margin: 0; }

.kpi .k { font-size: var(--fs-2xs); font-weight: var(--fw-semi); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpi .v { margin-top: var(--sp-1); font-family: var(--font-mono); font-size: var(--fs-2xl); font-weight: var(--fw-semi); font-variant-numeric: tabular-nums; }
.kpi .v.accent { color: var(--accent); }
.kpi .v.warn { color: var(--warn); }
.kpi .n { margin-top: var(--sp-1); font-size: var(--fs-xs); color: var(--muted); }

/* tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-xs); }
th { padding: var(--sp-2) var(--sp-3); text-align: left; font-size: var(--fs-2xs); font-weight: var(--fw-semi); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border2); white-space: nowrap; }
th button { all: unset; cursor: pointer; text-transform: inherit; letter-spacing: inherit; }
th button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
th[aria-sort] { color: var(--text); }
td { padding: var(--sp-3); border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--surface2); }
tr.click { cursor: pointer; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
.r { text-align: right; }
td.r { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 180px; }
.empty { padding: var(--sp-7) 0; text-align: center; color: var(--muted); font-size: var(--fs-xs); }
.pill { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--sp-3); border-radius: var(--r-pill); font-size: var(--fs-2xs); font-weight: var(--fw-medium); background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-family: var(--font-mono); white-space: nowrap; }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.pill.neutral { background: var(--surface3); color: var(--muted); }

/* hbar */
.hb { display: grid; grid-template-columns: minmax(70px, 1fr) minmax(0, 2fr) auto; align-items: center; gap: var(--sp-3); padding: var(--sp-1) 0; font-size: var(--fs-xs); width: 100%; border: 0; background: none; color: var(--text); text-align: left; }

button.hb:hover .name { text-decoration: underline; }
.hb .t { height: 8px; border-bottom: 1px solid var(--border2); }
.hb .f { display: block; height: 100%; background: var(--accent); border-radius: 0 var(--r-xs) var(--r-xs) 0; }
.hb .f.warn { background: var(--warn); }
.hb .val { font-family: var(--font-mono); font-size: var(--fs-2xs); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hb .val i { font-style: normal; color: var(--muted); margin-left: var(--sp-2); }
.hb .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: flex; justify-content: space-between; gap: var(--sp-4); padding: var(--sp-2) 0; font-size: var(--fs-xs); }
.kv > :first-child { color: var(--muted); }
.kv > :last-child { font-family: var(--font-mono); font-weight: var(--fw-medium); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kv .path { color: var(--text); font-family: var(--font-mono); font-weight: var(--fw-body); overflow: hidden; text-overflow: ellipsis; }
h4 { margin: var(--sp-4) 0 var(--sp-1); color: var(--muted); font-size: var(--fs-2xs); font-weight: var(--fw-semi); letter-spacing: .06em; text-transform: uppercase; }

/* grade + efficiency */
.grade-row { display: flex; align-items: center; gap: var(--sp-5); margin-bottom: var(--sp-4); }
.grade { display: grid; place-items: center; flex-shrink: 0; width: 56px; height: 56px; border-radius: var(--r-card); font-family: var(--font-mono); font-size: var(--fs-2xl); font-weight: var(--fw-bold); background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.grade.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.grade.bad { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.score { margin: 0; font-size: var(--fs-xl); font-weight: var(--fw-semi); }
.hint { margin: var(--sp-3) 0 0; color: var(--muted); font-size: var(--fs-2xs); }
.prog { display: flex; align-items: center; gap: var(--sp-3); }
.prog .t { flex: 1; height: 8px; border-radius: var(--r-pill); background: var(--surface3); overflow: hidden; }
.prog .f { display: block; height: 100%; background: var(--accent); }
.prog .f.warn { background: var(--warn); } .prog .f.bad { background: var(--danger); }
.prog .c { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--muted); white-space: nowrap; }
.live-row { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 2fr); align-items: center; gap: var(--sp-4); font-size: var(--fs-xs); padding: var(--sp-1) 0; }
.stack { display: flex; height: 12px; border-radius: var(--r-pill); overflow: hidden; background: var(--surface3); gap: 1px; }
.stack i { display: block; height: 100%; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 16px); grid-auto-columns: 16px; gap: 3px; }
.heat i { border-radius: var(--r-xs); background: var(--surface3); }
.row-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--sp-3) var(--sp-4); align-items: center; font-size: var(--fs-xs); }
.vs .m { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: var(--fw-semi); }
.vs .m.win { color: var(--accent); }
.vs .c { text-align: center; color: var(--muted); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .06em; }
.vs .a { text-align: right; }
.finding { padding: var(--sp-4) 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: var(--sp-2); }
.finding:last-child { border-bottom: 0; }
.finding h5 { margin: 0; font-size: var(--fs-sm); font-weight: var(--fw-semi); }
.finding p { margin: 0; color: var(--muted); font-size: var(--fs-xs); max-width: 70ch; }
.fix { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.fix code { font-family: var(--font-mono); font-size: var(--fs-2xs); background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--sp-1) var(--sp-3); overflow-wrap: anywhere; }
.drawer-wrap { position: fixed; inset: 0; z-index: 30; display: none; }
.drawer-wrap.open { display: block; }
.scrim { position: absolute; inset: 0; background: var(--overlay); }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(520px, 100%); overflow-y: auto; padding: var(--sp-5); padding-top: max(var(--sp-5), env(safe-area-inset-top, 0px)); background: var(--surface); border-left: 1px solid var(--border2); box-shadow: var(--elev-1); }
.drawer h2 { margin: 0 var(--sp-7) var(--sp-1) 0; font-size: var(--fs-md, 15px); font-weight: var(--fw-semi); }
.close { position: absolute; top: var(--sp-4); right: var(--sp-4); }
.note { margin: 0; font-size: var(--fs-xs); color: var(--muted); }
.flow svg { display: block; width: 100%; height: auto; overflow: visible; }
/* app shell, modelled on the CodeBurn desktop app */
body { padding: 0; }
.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; align-self: start; height: 100vh; display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-5) var(--sp-4); background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; }
.brand { margin: 0 var(--sp-3) var(--sp-4); font-size: var(--fs-xl); font-weight: var(--fw-bold); color: var(--accent); letter-spacing: -.01em; }
.side h6 { margin: var(--sp-5) var(--sp-3) var(--sp-1); font-size: var(--fs-2xs); font-weight: var(--fw-semi); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nav { display: flex; align-items: center; gap: var(--sp-3); height: var(--h-md); padding: 0 var(--sp-3); border: 0; border-radius: var(--r-md); background: none; color: var(--muted); font-size: var(--fs-sm); font-weight: var(--fw-medium); text-align: left; cursor: pointer; }
.nav:hover { color: var(--text); background: var(--surface2); }
.nav[aria-current="page"] { color: var(--text); background: var(--surface3); }
.nav svg { width: 15px; height: 15px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.side .grow { flex: 1; }
.ver { margin: var(--sp-4) var(--sp-3) 0; font-size: var(--fs-2xs); color: var(--muted); font-family: var(--font-mono); }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; padding: var(--sp-4) var(--sp-6); background: var(--bg); border-bottom: 1px solid var(--border); }
.top h1 { margin: 0; font-size: var(--fs-xl); font-weight: var(--fw-semi); letter-spacing: -.01em; }
.top .ctx { color: var(--muted); font-size: var(--fs-xs); }
.page { width: 100%; max-width: 1020px; margin: 0 auto; padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-4); }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: var(--sp-3) max(16px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--border); }
  .side h6, .side .grow, .ver, .brand { display: none; }
  .nav { white-space: nowrap; }
  .top { padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
  .page { padding: var(--sp-5) max(16px, env(safe-area-inset-left, 0px)); }
}
.card > .label:first-child { color: var(--text); letter-spacing: 0; text-transform: none; font-size: var(--fs-sm); font-weight: var(--fw-semi); }
.card.flush { padding: 0; overflow: hidden; }
.card.flush > .label { padding: var(--sp-4) var(--sp-5); margin: 0; border-bottom: 1px solid var(--border); }
.card.flush > .inner { padding: var(--sp-4) var(--sp-5); }
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: var(--sp-6); align-items: start; }
@media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero .big { color: var(--text); }
.stat3 { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: var(--sp-5); margin-top: var(--sp-5); padding-top: var(--sp-4); border-top: 1px solid var(--border); }
.stat3 span { display: block; font-size: var(--fs-2xs); color: var(--muted); }
.stat3 b { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: var(--fw-medium); }
.up { color: var(--danger); } .down { color: var(--accent); }
.ring-wrap { display: flex; gap: var(--sp-5); align-items: center; }
.ring { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); }
.ring .n { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--font-mono); font-size: var(--fs-xl); font-weight: var(--fw-bold); line-height: 1; }
.ring .n small { font-size: var(--fs-2xs); font-weight: var(--fw-body); color: var(--muted); }
.ring .g { position: absolute; left: 50%; bottom: -11px; transform: translateX(-50%); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); border: 2px solid var(--surface); }
.ring { margin-bottom: var(--sp-3); }
.sp { display: block; width: 100%; height: 72px; }
.chips { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.banner { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; font-size: var(--fs-sm); }
.banner .spacer { flex: 1; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: var(--fw-semi); font-size: var(--fs-xs); cursor: pointer; }
.link:hover { text-decoration: underline; }
.wir { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-5); }
@media (max-width: 760px) { .wir { grid-template-columns: minmax(0, 1fr); } }
.wir h5 { margin: 0 0 var(--sp-3); font-size: var(--fs-2xs); font-weight: var(--fw-semi); letter-spacing: .08em; text-transform: uppercase; }
.wir ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--sp-2); font-size: var(--fs-xs); color: var(--muted); }
.wins h5 { color: var(--accent); } .imps h5 { color: var(--warn); } .risks h5 { color: var(--danger); }
.lrow { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-3) 0; border-bottom: 1px solid var(--border); font-size: var(--fs-xs); }
.lrow:last-child { border-bottom: 0; }
.lrow .i { color: var(--muted); font-family: var(--font-mono); width: 22px; flex-shrink: 0; }
.lrow .b { flex: 1; min-width: 0; }

/* ── Atlas shell: TopBar.svelte + Tabs.svelte, replacing the CodeBurn sidebar ── */
@font-face { font-family: "Material Symbols Outlined"; font-style: normal; font-weight: 100 700; font-display: block; src: url("src/assets/fonts/material-symbols-subset.woff2") format("woff2"); }

:root { --ink: #17181b; --ink-text: #ffffff; --h-xs: 20px; --h-2xs: 18px; --h-lg: 32px; --sp-8: 32px; --r-lg: 7px; --ink-hover-bg: color-mix(in srgb, var(--ink) 88%, var(--bg)); }
