[package]
name = "atlas"
version = "2.0.0"
description = "Mission control for Claude Code sessions"
authors = ["Jake Howden"]
license = "MIT"
repository = "https://github.com/jakehowden96/Atlas"
edition = "2021"

[lib]
name = "atlas_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9.0"
notify = "8.2.0"
dirs = "6.0.0"
tokio = { version = "1.50.0", features = ["sync", "rt", "time"] }
log = "0.4.29"
fern = { version = "0.7", features = ["date-based"] }
chrono = "0.4"
ts-rs = "12"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.50.0", features = ["macros"] }

[profile.release]
# Size over peak speed: Atlas is I/O-bound (PTYs, file watching, git), so LTO,
# one codegen unit and opt-level "s" cost build time and buy a smaller binary.
lto = true
codegen-units = 1
opt-level = "s"
strip = true
